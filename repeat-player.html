<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>复读机</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 15px; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f3f4f6; color: #1f2937; }
  header { background: #059669; color: #fff; padding: 12px 14px; font-size: 17px; font-weight: bold; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; }
  header #settingsBtn { margin-left: auto; background: rgba(255,255,255,.15); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; padding: 0; }
  header #settingsBtn svg { width: 20px; height: 20px; }
  header #backBtn { background: rgba(255,255,255,.15); border: none; color: #fff; width: 34px; height: 34px; border-radius: 50%; padding: 0; margin-right: 10px; flex: none; }
  header #backBtn svg { width: 22px; height: 22px; }
  .wrap { padding: 12px; max-width: 720px; margin: 0 auto; }
  button { font-family: inherit; cursor: pointer; border: 1px solid #d1d5db; background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  button:hover { background: #dbeafe; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; font-size: 12px; user-select: none; }
  .chip:hover { background: #dbeafe; }
  .chip.on { background: #059669; color: #fff; border-color: #059669; }
  /* 录音区 */
  #recCard { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; padding: 20px 14px; text-align: center; }
  #recBtn { width: 96px; height: 96px; border-radius: 50%; border: none; background: #059669; color: #fff; box-shadow: 0 4px 14px rgba(5,150,105,.35); }
  #recBtn svg { width: 40px; height: 40px; }
  #recBtn.recording { background: #dc2626; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  #recState { margin-top: 10px; font-size: 14px; color: #6b7280; }
  #recTime { font-size: 24px; font-weight: bold; margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* 列表 */
  .rec { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 10px; margin-top: 10px; }
  .rec.playing { border-color: #059669; box-shadow: 0 0 0 2px rgba(5,150,105,.2); }
  .rec-head { display: flex; align-items: center; gap: 8px; }
  .playBtn { width: 44px; height: 44px; border-radius: 50%; flex: none; border-color: #059669; color: #059669; background: #fff; }
  .playBtn svg { width: 20px; height: 20px; }
  .playBtn.playing { background: #059669; color: #fff; }
  .stopBtn { width: 44px; height: 44px; border-radius: 50%; flex: none; color: #dc2626; border-color: #fca5a5; background: #fff; }
  .stopBtn svg { width: 18px; height: 18px; }
  .rec-name { font-size: 14px; font-weight: bold; word-break: break-all; }
  .rec-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
  .rec-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0 0 52px; }
  .rec-tags .t { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
  .rec-note { font-size: 12px; color: #4b5563; margin: 5px 0 0 52px; word-break: break-all; }
  .rec-stat-line { font-size: 11px; color: #059669; margin: 5px 0 0 52px; min-height: 0; }
  .rec-stat-line:empty { margin-top: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .opts .lbl { font-size: 12px; color: #6b7280; flex: none; }
  .optsRow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 4px; }
  .optsRow .lbl { font-size: 12px; color: #6b7280; width: 40px; flex: none; white-space: nowrap; }
  .optsRow .chip { font-size: 12px; padding: 5px 9px; }
  .row2 { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .row2 button { font-size: 12px; padding: 6px 10px; }
  .danger { color: #dc2626; border-color: #fca5a5; }
  .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 14px; }
  .sect { font-weight: bold; margin: 16px 0 2px; font-size: 14px; }
  .rec-toggle { flex: none; font-size: 11px; padding: 5px 9px; border-radius: 8px; color: #059669; border-color: #a7f3d0; margin-left: auto; }
  /* 小屏安卓（如三星 Note20 较短宽度场景） */
  @media (max-width: 380px) {
    html { font-size: 14px; }
    button { font-size: 13px; }
    .playBtn, .stopBtn { width: 40px; height: 40px; }
    .playBtn svg { width: 18px; height: 18px; }
    .optsRow .chip { font-size: 11px; padding: 4px 8px; }
  }
  /* 剪裁面板 */
  #trimMask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #trimMask.hidden { display: none; }
  .trimBox { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; }
  .trimName { font-weight: bold; font-size: 16px; text-align: center; }
  .trimInfo { text-align: center; font-size: 15px; font-weight: bold; margin: 8px 0 2px; color: #059669; }
  .trimLabels { display: flex; justify-content: space-between; font-size: 12px; color: #6b7280; margin: 0 8px; }
  .trimTrack { position: relative; height: 46px; margin: 10px 14px 2px; }
  .trimRail { position: absolute; top: 19px; left: 0; right: 0; height: 8px; background: #e5e7eb; border-radius: 4px; }
  .trimSel { position: absolute; top: 19px; height: 8px; background: #34d399; border-radius: 4px; }
  .trimHandle { position: absolute; top: 7px; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); touch-action: none; cursor: grab; z-index: 2; }
  .trimHandle:active { cursor: grabbing; }
  .trimHandle.s { background: #059669; }
  .trimHandle.e { background: #dc2626; }
  .stepBtns { display: flex; gap: 6px; justify-content: center; align-items: center; margin: 6px 0 2px; flex-wrap: wrap; }
  .stepBtns button { font-size: 12px; padding: 5px 10px; }
  .stepBtns .lbl { font-size: 12px; color: #6b7280; }
  .trimBtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .trimBtns button { flex: 1; min-width: 120px; font-size: 14px; padding: 10px; }
  .trimTip { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 8px; }
  /* 播放位置亮点 */
  .trimPos { position: absolute; top: 15px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #fff; border: 3px solid #2563eb; box-shadow: 0 0 5px rgba(37,99,235,.7); z-index: 3; pointer-events: none; }
  .trimPos.hidden { display: none; }
  /* 停止按钮 / 折叠按钮 */
  .rec-body.collapsed { display: none; }
  /* 保存对话框 */
  #saveMask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #saveMask.hidden { display: none; }
  #settingsMask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #settingsMask.hidden { display: none; }
  .saveBox { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; }
  #settingsMask .saveBox { max-height: 70vh; }
  .saveBox .sect2 { font-weight: bold; font-size: 14px; margin: 12px 0 6px; }
  #saveName { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 10px; font-family: inherit; }
  #saveNote { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 10px; min-height: 56px; font-family: inherit; margin-top: 8px; }
  .tagRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .saveBtns { display: flex; gap: 8px; margin-top: 14px; }
  .saveBtns button { flex: 1; padding: 10px; font-size: 14px; }
  /* 设置面板：标签库管理 */
  .tagManageRow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 10px; margin-top: 8px; }
  .tagManageRow .tname { flex: 1; font-size: 14px; word-break: break-all; }
  .tagManageRow button { font-size: 12px; padding: 5px 10px; }
  .addTagRow { display: flex; gap: 8px; margin-top: 10px; }
  .addTagRow input { flex: 1; padding: 9px 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 10px; font-family: inherit; }
  .hintLine { font-size: 12px; color: #9ca3af; margin-top: 10px; line-height: 1.6; }
  .author { text-align: center; font-size: 12px; color: #9ca3af; padding: 22px 14px 10px; line-height: 1.7; }
</style>
</head>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };

var SPEEDS = [0.5, 0.75, 1, 1.5, 2, 3];
var REPEATS = [[1, '1遍'], [3, '3遍'], [5, '5遍'], [0, '循环']];
var GAPS = [[0, '不停顿'], [1, '停1秒'], [2, '停2秒'], [3, '停3秒']];
var FX_TYPES = [['none', '原声'], ['echo', '回声'], ['reverb', '混响']];
var FX_LEVELS = [[1, '弱'], [2, '中'], [3, '强']];

/* 专业线性图标（currentColor 随按钮颜色） */
var ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.5-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V18H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.1A5 5 0 0 0 17 11z"/></svg>'
};

/* ---------- IndexedDB ---------- */
var DB = {
  open: function () {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('fuduji', 1);
      r.onupgradeneeded = function (e) { e.target.result.createObjectStore('recs', { keyPath: 'id', autoIncrement: true }); };
      r.onsuccess = function (e) { res(e.target.result); };
      r.onerror = function () { rej(r.error); };
    });
  },
  put: function (item) {
    return DB.open().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('recs', 'readwrite');
        var rq = tx.objectStore('recs').put(item);
        rq.onsuccess = function () { item.id = rq.result; res(item); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  },
  all: function () {
    return DB.open().then(function (db) {
      return new Promise(function (res, rej) {
        var rq = db.transaction('recs').objectStore('recs').getAll();
        rq.onsuccess = function () { res(rq.result || []); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  },
  del: function (id) {
    return DB.open().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('recs', 'readwrite');
        tx.objectStore('recs').delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
};

/* ---------- 录音 ---------- */
var recs = [];
var recorder = null, stream = null, chunks = [];
var recStart = 0, timerInt = null;
var recording = false;

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return ('0' + m).slice(-2) + ':' + ('0' + s).slice(-2);
}

function pickMime() {
  var cands = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  for (var i = 0; i < cands.length; i++) {
    try { if (MediaRecorder.isTypeSupported(cands[i])) return cands[i]; } catch (e) {}
  }
  return '';
}

/* WAV 编码（供 iOS Safari / iOS Chrome 回退） */
var waRec = null;
function writeString(view, offset, string) {
  for (var i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
}
function encodeWAV(samples, sampleRate) {
  var buffer = new ArrayBuffer(44 + samples.length * 2);
  var view = new DataView(buffer);
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, samples.length * 2, true);
  for (var i = 0; i < samples.length; i++) {
    var s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}
function startWebAudioRec(st) {
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var ctx = new AudioCtx();
  var source = ctx.createMediaStreamSource(st);
  var processor = ctx.createScriptProcessor(4096, 1, 1);
  var buffers = [];
  processor.onaudioprocess = function (e) {
    buffers.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  source.connect(processor);
  processor.connect(ctx.destination);
  return {
    stop: function () {
      processor.disconnect();
      source.disconnect();
      var len = 0;
      buffers.forEach(function (b) { len += b.length; });
      var merged = new Float32Array(len), offset = 0;
      buffers.forEach(function (b) { merged.set(b, offset); offset += b.length; });
      var rate = ctx.sampleRate;
      ctx.close();
      return encodeWAV(merged, rate);
    }
  };
}

function startRec() {
  stopCur(); /* 录音前停止播放，避免把播放的声音录进去 */
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert('当前浏览器不支持录音，请在 iPhone 上用 Safari 打开');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
    stream = st;
    chunks = [];
    waRec = null;
    recorder = null;
    if (window.MediaRecorder && pickMime()) {
      var mime = pickMime();
      recorder = mime ? new MediaRecorder(st, { mimeType: mime }) : new MediaRecorder(st);
      recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = function () {
        var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        openSaveDialog(blob, (Date.now() - recStart) / 1000);
      };
      recorder.start();
    } else {
      waRec = startWebAudioRec(st);
    }
    recStart = Date.now();
    recording = true;
    $('recBtn').classList.add('recording');
    $('recIcon').outerHTML = '<svg id="recIcon" viewBox="0 0 24 24" fill="currentColor">' +

/* ---------- 常用标签库（localStorage 持久化，设置页管理） ---------- */
var TAG_LIB_KEY = 'fuduji_taglib_v1';
var DEFAULT_TAGS = ['语文', '英语', '历史', '道法', '古诗词', '散文', '作文', '朗诵', '名言名句', '单词', '口语', '课文', '速记', '预习', '复习', '错题', '其他'];

function getTagLib() {
  try {
    var v = JSON.parse(localStorage.getItem(TAG_LIB_KEY) || 'null');
    if (v && v.length) return v;
  } catch (e) {}
  return DEFAULT_TAGS.slice();
}
function saveTagLib(list) {
  localStorage.setItem(TAG_LIB_KEY, JSON.stringify(list));
}
/* 首次/升级时同步默认标签：按默认顺序重排，追加新项、移除已替换的旧项（用户自定义项保留在末尾） */
(function migrateTagLib() {
  var FLAG = 'fuduji_taglib_seed_v5';
  if (localStorage.getItem(FLAG)) return;
  var list = getTagLib();
  /* 旧版程序默认、新版已改名移除的标签 */
  ['语文课文', '古诗'].forEach(function (old) {
    var i = list.indexOf(old);
    if (i >= 0) list.splice(i, 1);
  });
  var ordered = [];
  DEFAULT_TAGS.forEach(function (t) { if (list.indexOf(t) >= 0) ordered.push(t); });
  list.forEach(function (t) { if (ordered.indexOf(t) < 0) ordered.push(t); });
  DEFAULT_TAGS.forEach(function (t) { if (ordered.indexOf(t) < 0) ordered.push(t); });
  saveTagLib(ordered);
  localStorage.setItem(FLAG, '1');
})();
function isDateTag(t) { return /^\d{4}年\d{1,2}月\d{1,2}日$/.test(t) || /^\d{4}年\d{1,2}月$/.test(t) || /^星期.$/.test(t); }
function todayDateTags() {
  var d = new Date();
  return [d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日',
          d.getFullYear() + '年' + (d.getMonth() + 1) + '月',
          '星期' + '日一二三四五六'.charAt(d.getDay())];
}

var dlgCtx = null;   // {mode:'new',blob,dur} 或 {mode:'edit',item}
var selTags = {};

function defaultRecName() {
  var d = new Date();
  return '录音 ' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' +
         ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}

function fillTagChips(initialTags) {
  selTags = {};
  (initialTags || []).forEach(function (t) { selTags[t] = true; });
  /* 顺序：今天日期标签（含已选的旧日期标签）→ 标签库（按设置中的顺序）→ 已选但不在库中的标签 */
  var dateCands = [], contentCands = [];
  function pushUnique(arr, t) { if (t && arr.indexOf(t) < 0) arr.push(t); }
  todayDateTags().forEach(function (t) { pushUnique(dateCands, t); });
  (initialTags || []).forEach(function (t) { if (isDateTag(t)) pushUnique(dateCands, t); });
  getTagLib().forEach(function (t) { pushUnique(contentCands, t); });
  (initialTags || []).forEach(function (t) { if (!isDateTag(t)) pushUnique(contentCands, t); });

  var box = $('tagChips'); box.innerHTML = '';
  dateCands.concat(contentCands).forEach(function (t) {
    box.appendChild(chip(t, !!selTags[t], function () {
      selTags[t] = !selTags[t];
      this.classList.toggle('on', !!selTags[t]);
    }));
  });
}

/* ---------- 播放（带复读次数与停顿） ---------- */
var cur = null; // {id, audio, url, timer, fxNodes}
var repeatLeft = 0;

/* ---------- 音效：回声 / 混响（Web Audio API） ---------- */
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

/* 生成混响用的脉冲响应：衰减白噪声，模拟大厅反射 */
function makeImpulse(ctx, seconds, decay) {
  var rate = ctx.sampleRate, len = Math.floor(rate * seconds);
  var buf = ctx.createBuffer(2, len, rate);
  for (var ch = 0; ch < 2; ch++) {
    var data = buf.getChannelData(ch);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

/* 给正在播放的 audio 元素挂上效果链；返回清理函数，不支持时返回 null（走原声） */
function buildFxGraph(item, audio) {
  var fx = item.fx || 'none';
  if (fx === 'none') return null;
  var ctx = getAudioCtx();
  if (!ctx) return null;
  var nodes = [];
  try {
    var src = ctx.createMediaElementSource(audio); nodes.push(src);
    var master = ctx.createGain(); master.connect(ctx.destination); nodes.push(master);
    src.connect(master); /* 干声始终保留 */
    var lv = item.fxLv || 2, wet, delay, fb, conv;
    if (fx === 'echo') {
      var delayTime = [0.22, 0.3, 0.42][lv - 1];
      var fbv = [0.2, 0.38, 0.55][lv - 1];
      var wetV = [0.25, 0.4, 0.55][lv - 1];
      delay = ctx.createDelay(2); delay.delayTime.value = delayTime; nodes.push(delay);
      fb = ctx.createGain(); fb.gain.value = fbv; nodes.push(fb);
      wet = ctx.createGain(); wet.gain.value = wetV; nodes.push(wet);
      src.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    } else {
      var secs = [1.0, 2.0, 3.2][lv - 1];
      var decay = [2, 2.8, 3.6][lv - 1];
      var wetV2 = [0.25, 0.4, 0.55][lv - 1];
      conv = ctx.createConvolver(); conv.buffer = makeImpulse(ctx, secs, decay); nodes.push(conv);
      wet = ctx.createGain(); wet.gain.value = wetV2; nodes.push(wet);
      src.connect(conv); conv.connect(wet); wet.connect(master);
    }
    return { disconnect: function () { nodes.forEach(function (n) { try { n.disconnect(); } catch (e) {} }); } };
  } catch (e) {
    return null;
  }
}

function stopCur() {
  if (!cur) return;
  clearTimeout(cur.timer);
  cur.audio.pause();
  if (cur.fxNodes) cur.fxNodes.disconnect();
  URL.revokeObjectURL(cur.url);
  cur = null;
  resetPlayingUI();
}

function resetPlayingUI() {
  Array.prototype.forEach.call(document.querySelectorAll('.rec'), function (el) {
    el.classList.remove('playing');
    var btn = el.querySelector('.playBtn');
    btn.classList.remove('playing');
    btn.innerHTML = ICON.play;
    el.querySelector('.rec-stat-line').textContent = '';
  });
}

function findRec(id) {
  for (var i = 0; i < recs.length; i++) if (recs[i].id === id) return recs[i];
  return null;
}

function setCurStatus(text) {
  if (!cur) return;
  var el = document.querySelector('.rec[data-id="' + cur.id + '"] .rec-stat-line');
  if (el) el.textContent = text;
}

function trimStartOf(it) { return it.trimStart || 0; }
function trimEndOf(it) { return (it.trimEnd && it.trimEnd > 0) ? it.trimEnd : null; }
function segDur(it) {
  var e = trimEndOf(it);
  return (e != null ? e : (it.duration || 0)) - trimStartOf(it);
}

function togglePlay(item) {
  if (cur && cur.id === item.id) {
    if (cur.audio.paused) {
      clearTimeout(cur.timer);
      if (cur.inGap) cur.audio.currentTime = trimStartOf(item);
      cur.audio.play();
      cur.inGap = false;
      updatePlayBtns(item.id, true);
      setCurStatus(item.repeat === 0 ? '循环播放中…' : '还剩 ' + repeatLeft + ' 遍');
    } else {
      cur.audio.pause();
      updatePlayBtns(item.id, false);
      clearTimeout(cur.timer);
      setCurStatus('已暂停');
    }
    return;
  }
  stopCur();
  var url = URL.createObjectURL(item.blob);
  var audio = new Audio(url);
  audio.playbackRate = item.speed || 1;
  var t0 = trimStartOf(item);
  var t1 = trimEndOf(item);
  repeatLeft = item.repeat === 0 ? Infinity : (item.repeat || 1);
  var fxNodes = buildFxGraph(item, audio);
  cur = { id: item.id, audio: audio, url: url, timer: 0, fxNodes: fxNodes, inGap: false };
  setCurStatus(item.repeat === 0 ? '循环播放中…' : '还剩 ' + repeatLeft + ' 遍');

  function segEnded() {
    if (!cur || cur.audio !== audio) return;
    audio.pause();
    if (repeatLeft === Infinity || repeatLeft > 1) {
      cur.inGap = true;
      if (repeatLeft !== Infinity) {
        repeatLeft--;
        setCurStatus((item.gap ? '跟读停顿… ' : '') + '还剩 ' + repeatLeft + ' 遍');
      }
      cur.timer = setTimeout(function () {
        if (cur && cur.audio === audio) {
          audio.currentTime = t0;
          cur.inGap = false;
          audio.play();
          if (repeatLeft !== Infinity) setCurStatus('还剩 ' + repeatLeft + ' 遍');
        }
      }, (item.gap || 0) * 1000);
    } else {
      stopCur();
      renderList();
    }
  }
  audio.onended = segEnded;
  audio.ontimeupdate = function () {
    if (cur && cur.audio === audio && t1 !== null && audio.currentTime >= t1) segEnded();
  };
  audio.onerror = function () { stopCur(); renderList(); };
  audio.currentTime = t0;
  audio.play().then(function () { audio.currentTime = t0; }).catch(function () { stopCur(); });
  updatePlayBtns(item.id, true);
}

function stopPlay(item) {
  if (cur && cur.id === item.id) { stopCur(); renderList(); }
}

function updatePlayBtns(id, playing) {
  Array.prototype.forEach.call(document.querySelectorAll('.rec'), function (el) {
    var btn = el.querySelector('.playBtn');
    if (+el.dataset.id !== id) {
      btn.classList.remove('playing');
      btn.innerHTML = ICON.play;
      return;
    }
    btn.classList.toggle('playing', playing);
    btn.innerHTML = playing ? ICON.pause : ICON.play;
  });
}

/* ---------- 列表 ---------- */
var expandState = {}; /* id -> true/false；未设置时默认第一条展开 */

function chip(text, on, fn) {
  var c = document.createElement('button');
  c.className = 'chip' + (on ? ' on' : '');
  c.textContent = text;
  c.onclick = fn;
  return c;
}

function renderList() {
  return DB.all().then(function (all) {
    recs = all.sort(function (a, b) { return b.createdAt - a.createdAt; });
    var box = $('list'); box.innerHTML = '';
    if (!recs.length) { box.innerHTML = '<div class="empty">还没有录音，点上方麦克风开始</div>'; return; }
    recs.forEach(function (it, idx) {
      var expanded = (it.id in expandState) ? expandState[it.id] : (idx === 0);
      var card = document.createElement('div');
      card.className = 'rec'; card.dataset.id = it.id;

      var head = document.createElement('div'); head.className = 'rec-head';
      var pb = document.createElement('button'); pb.className = 'playBtn'; pb.title = '播放 / 暂停（从当前位置继续）';
      pb.innerHTML = ICON.play;
      pb.onclick = function () { togglePlay(it); };
      head.appendChild(pb);
      var sb = document.createElement('button'); sb.className = 'stopBtn'; sb.title = '停止（回到开头）';
      sb.innerHTML = ICON.stop;

      head.appendChild(sb);
      var mid = document.createElement('div'); mid.style.flex = '1'; mid.style.minWidth = '0';
      var nm = document.createElement('div'); nm.className = 'rec-name'; nm.textContent = it.name;
      var meta = document.createElement('div'); meta.className = 'rec-meta';
      var trimmed = (it.trimStart && it.trimStart > 0.05) || (it.trimEnd && it.trimEnd < it.duration - 0.05);
      meta.textContent = (trimmed ? '✂片段 ' + fmt(segDur(it)) + ' / 原' + fmt(it.duration) : fmt(it.duration)) +
        ' · ' + new Date(it.createdAt).toLocaleDateString() +
        ((it.fx && it.fx !== 'none') ? ' · ' + (it.fx === 'echo' ? '回声·' : '混响·') + (['','弱','中','强'][it.fxLv || 2] || '') : '');
      mid.appendChild(nm); mid.appendChild(meta);
      head.appendChild(mid);
      var tg = document.createElement('button'); tg.className = 'rec-toggle';
      tg.textContent = expanded ? '收起' : '设置';
      tg.onclick = function () { expandState[it.id] = !expanded; renderList(); };
      head.appendChild(tg);

      card.appendChild(statLine);

      var body = document.createElement('div');
      body.className = 'rec-body' + (expanded ? '' : ' collapsed');

      var opts = document.createElement('div'); opts.className = 'opts';
      var rSpeed = document.createElement('div'); rSpeed.className = 'optsRow';
      var l1 = document.createElement('span'); l1.className = 'lbl'; l1.textContent = '倍速'; rSpeed.appendChild(l1);
      SPEEDS.forEach(function (s) {
        rSpeed.appendChild(chip(s + 'x', (it.speed || 1) === s, function () {
          it.speed = s; DB.put(it);
          if (cur && cur.id === it.id) cur.audio.playbackRate = s;
          renderList();
        }));
      });
      opts.appendChild(rSpeed);
      var rRepeat = document.createElement('div'); rRepeat.className = 'optsRow';
      var l2 = document.createElement('span'); l2.className = 'lbl'; l2.textContent = '复读'; rRepeat.appendChild(l2);
      REPEATS.forEach(function (rp) {
        rRepeat.appendChild(chip(rp[1], (it.repeat === undefined ? 3 : it.repeat) === rp[0], function () {
          it.repeat = rp[0]; DB.put(it); renderList();
        }));
      });
      opts.appendChild(rRepeat);
      var rGap = document.createElement('div'); rGap.className = 'optsRow';
      var l3 = document.createElement('span'); l3.className = 'lbl'; l3.textContent = '停顿'; rGap.appendChild(l3);
      GAPS.forEach(function (gp) {
        rGap.appendChild(chip(gp[1], (it.gap === undefined ? 1 : it.gap) === gp[0], function () {
          it.gap = gp[0]; DB.put(it); renderList();
        }));
      });
      opts.appendChild(rGap);
      var rFx = document.createElement('div'); rFx.className = 'optsRow';
      var l4 = document.createElement('span'); l4.className = 'lbl'; l4.textContent = '音效'; rFx.appendChild(l4);
      FX_TYPES.forEach(function (fp) {
        rFx.appendChild(chip(fp[1], (it.fx || 'none') === fp[0], function () {

        var l5 = document.createElement('span'); l5.className = 'lbl'; l5.textContent = '强度'; rFxLv.appendChild(l5);
        FX_LEVELS.forEach(function (lv) {
          rFxLv.appendChild(chip(lv[1], (it.fxLv || 2) === lv[0], function () {

      var row2 = document.createElement('div'); row2.className = 'row2';

        a.click();

      };
      var del = document.createElement('button'); del.className = 'danger'; del.textContent = '🗑 删除';
      del.onclick = function () {
        if (!confirm('确定删除这条录音吗？')) return;
        if (cur && cur.id === it.id) stopCur();
        DB.del(it.id).then(renderList);
      };
      row2.appendChild(trimBtn); row2.appendChild(rn); row2.appendChild(dl); row2.appendChild(del);
      body.appendChild(row2);

      card.appendChild(body);
      box.appendChild(card);
    });
    if (cur) {
      updatePlayBtns(cur.id, !cur.audio.paused);
      var ci = findRec(cur.id);
      var cardEl = document.querySelector('.rec[data-id="' + cur.id + '"] .rec-stat-line');
      if (ci && cardEl) cardEl.textContent = ci.repeat === 0 ? '循环中' : ('还剩 ' + repeatLeft + ' 遍');
    }
  });
}

/* ---------- 掐头去尾 ---------- */
var trimCtx = null; // {item,dur,t0,t1,audio,url}

function fmt1(sec) {
  sec = Math.max(0, sec);
  var m = Math.floor(sec / 60), s = sec - m * 60;
  return ('0' + m).slice(-2) + ':' + ('0' + s.toFixed(1)).slice(-4);
}

function openTrim(it) {
  stopCur(); /* 打开裁剪前停止正在播放的录音 */
  closeTrim();
  var url = URL.createObjectURL(it.blob);
  var au = new Audio(url);
  trimCtx = {
    item: it, dur: it.duration || 0,
    t0: trimStartOf(it),
    t1: trimEndOf(it) != null ? trimEndOf(it) : (it.duration || 0),
    audio: au, url: url
  };
  au.onloadedmetadata = function () {
    if (isFinite(au.duration) && au.duration > 0) {
      trimCtx.dur = au.duration;
      if (trimEndOf(it) == null) trimCtx.t1 = au.duration;
      updateTrimUI();
    }
  };
  au.ontimeupdate = function () {
    if (!trimCtx || trimCtx.audio !== au) return;
    /* 更新播放位置亮点 */
    $('trimPos').classList.remove('hidden');
    $('trimPos').style.left = Math.max(0, Math.min(100, au.currentTime / (trimCtx.dur || 1) * 100)) + '%';
    $('trimPosLbl').textContent = '▶ ' + fmt1(au.currentTime);
    if (au.currentTime >= trimCtx.t1 - 0.02) {
      au.pause(); au.currentTime = trimCtx.t0;
      $('trimPreview').textContent = '▶ 试听片段';
    }
  };
  $('trimName').textContent = it.name;
  $('trimPreview').textContent = '▶ 试听片段';
  updateTrimUI();
  $('trimMask').classList.remove('hidden');
}

function closeTrim() {
  if (trimCtx) {
    try { trimCtx.audio.pause(); } catch (e) {}
    URL.revokeObjectURL(trimCtx.url);
    trimCtx = null;
  }
  $('trimPos').classList.add('hidden');
  $('trimPosLbl').textContent = '';
  $('trimMask').classList.add('hidden');
}

function updateTrimUI() {
  var c = trimCtx; if (!c) return;
  var d = c.dur || 1;
  var p0 = Math.max(0, Math.min(100, c.t0 / d * 100));
  var p1 = Math.max(0, Math.min(100, c.t1 / d * 100));
  $('hStart').style.left = p0 + '%';
  $('hEnd').style.left = p1 + '%';
  var sel = $('trimSel');
  sel.style.left = p0 + '%';
  sel.style.width = Math.max(0, p1 - p0) + '%';
  $('trimStartLbl').textContent = '起点 ' + fmt1(c.t0);
  $('trimEndLbl').textContent = '终点 ' + fmt1(c.t1);
  $('trimSeg').textContent = '保留片段 ' + fmt1(Math.max(0, c.t1 - c.t0));
  /* 未播放时亮点停在起点位置 */
  if (c.audio.paused) {
    $('trimPos').style.left = Math.max(0, Math.min(100, (c.audio.currentTime || c.t0) / d * 100)) + '%';
  }
}

/* 拖拽手柄（pointer events，手机/桌面通用） */
function bindHandle(which) {
  var h = $(which === 's' ? 'hStart' : 'hEnd');
  h.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { h.setPointerCapture(e.pointerId); } catch (err) {}
    function move(ev) {
      if (!trimCtx) return;
      var r = $('trimTrack').getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
      var t = p * (trimCtx.dur || 0);
      if (which === 's') trimCtx.t0 = Math.min(t, trimCtx.t1 - 0.3);
      else trimCtx.t1 = Math.max(t, trimCtx.t0 + 0.3);
      updateTrimUI();
    }
    function up(ev) {
      try { h.releasePointerCapture(ev.pointerId); } catch (err) {}
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
    }
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  });
}
bindHandle('s');
bindHandle('e');

/* ±0.5秒微调 */
Array.prototype.forEach.call(document.querySelectorAll('.stepBtns button'), function (b) {
  b.onclick = function () {
    if (!trimCtx) return;
    var d = +b.dataset.d;
    if (b.dataset.h === 's') trimCtx.t0 = Math.max(0, Math.min(trimCtx.t1 - 0.3, trimCtx.t0 + d));
    else trimCtx.t1 = Math.min(trimCtx.dur, Math.max(trimCtx.t0 + 0.3, trimCtx.t1 + d));
    updateTrimUI();
  };
});

$('trimPreview').onclick = function () {
  var c = trimCtx; if (!c) return;
  var au = c.audio;
  if (!au.paused) { au.pause(); this.textContent = '▶ 试听片段'; return; }
  if (au.currentTime < c.t0 - 0.05 || au.currentTime >= c.t1) au.currentTime = c.t0;
  var pr = au.play();
  if (pr && pr.catch) pr.catch(function () {});
  this.textContent = '⏸ 暂停';
};
$('trimSetStart').onclick = function () {
  var c = trimCtx; if (!c) return;
  c.t0 = Math.max(0, Math.min(c.audio.currentTime || 0, c.t1 - 0.3));
  updateTrimUI();
};
$('trimSetEnd').onclick = function () {
  var c = trimCtx; if (!c) return;
  var t = c.audio.currentTime || c.dur;
  c.t1 = Math.min(c.dur, Math.max(t, c.t0 + 0.3));
  updateTrimUI();
};
$('trimReset').onclick = function () {
  var c = trimCtx; if (!c) return;
  c.t0 = 0; c.t1 = c.dur;
  try { c.audio.pause(); c.audio.currentTime = 0; } catch (e) {}
  $('trimPreview').textContent = '▶ 试听片段';
  updateTrimUI();
};
$('trimCancel').onclick = function () { closeTrim(); };
$('trimMask').addEventListener('click', function (e) {
  if (e.target === $('trimMask')) closeTrim();
});
$('trimSave').onclick = function () {
  var c = trimCtx; if (!c) return;
  var it = c.item;
  it.trimStart = c.t0 > 0.1 ? +c.t0.toFixed(2) : 0;
  it.trimEnd = c.t1 < c.dur - 0.1 ? +c.t1.toFixed(2) : null;
  if (cur && cur.id === it.id) stopCur();
  DB.put(it).then(function () { closeTrim(); renderList(); });
};

renderList();
})();
</script>
<script src="pwa-register.js"></script>
</body>
